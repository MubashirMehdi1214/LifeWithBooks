  <style>/* Critical above-the-fold CSS (~4kb) — header, nav, hero, book grid shell */
:root{--contrast:#172021;--contrast-3:#666;--contrast-4:#a3a791;--base:#faf0e2;--base-2:#fff;--accent:#1E565C;--accent-hover:#2a747c;--shadow:0 2px 14px rgba(23,32,33,.08);--shadow-hover:0 8px 24px rgba(23,32,33,.15);--radius:6px;--max-width:1200px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#fff;color:var(--contrast-3);font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
img{max-width:100%;display:block;height:auto}
h1,h2,h3{color:var(--contrast);font-weight:700;line-height:1.25}
.site-header{background:#fff;border-bottom:1px solid #eee;text-align:center;padding:24px 20px 0;position:relative;z-index:20}
.site-header .site-logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:14px}
.site-header .logo-mark{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#2a747c);display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;box-shadow:var(--shadow)}
.site-header .logo-text{text-align:left;line-height:1.1}
.site-header .logo-text strong{display:block;color:var(--contrast);font-size:22px;font-weight:800}
.main-nav{background:var(--accent);position:sticky;top:0;z-index:100}
.main-nav .nav-inner{max-width:var(--max-width);margin:0 auto;display:flex;align-items:center;justify-content:center;padding:0 20px;position:relative}
.main-nav ul{display:flex;list-style:none;gap:0;align-items:center}
.main-nav ul li a{display:block;color:#fff;padding:14px 18px;font-weight:600;font-size:15px}
.menu-toggle{display:none;background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:12px}
.hero{background:linear-gradient(135deg,var(--base) 0%,#fff 60%);padding:80px 20px;text-align:center}
.hero h1{font-size:clamp(1.9rem,4vw,2.8rem);margin-bottom:16px;color:var(--contrast)}
.hero p{max-width:680px;margin:0 auto 28px;font-size:17px;color:var(--contrast-3)}
.hero .search-box{display:flex;max-width:560px;margin:0 auto;background:#fff;border-radius:100px;padding:6px 6px 6px 24px;box-shadow:var(--shadow-hover)}
.hero .search-box input{flex:1;border:none;outline:none;font-size:16px;font-family:inherit;background:transparent;padding:12px 0}
.hero .search-box button{background:var(--accent);color:#fff;border:none;border-radius:100px;padding:12px 28px;font-weight:700;font-size:15px;cursor:pointer;min-height:44px}
.section{padding:60px 20px;max-width:var(--max-width);margin:0 auto}
.section-title{text-align:center;margin-bottom:36px}
.section-title h1,.section-title h2,.section-title a{font-size:clamp(1.4rem,3vw,1.9rem);color:var(--contrast)}
.book-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 20px}
.book-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.book-card a.thumb{display:block;position:relative;background:linear-gradient(135deg,#f6e9d0,#fff);padding:26px 18px;aspect-ratio:3/4;overflow:hidden;min-height:200px}
.book-card .cover{position:absolute;inset:26px 18px;display:flex;align-items:center;justify-content:center}
.book-card .cover .cover-image,.book-card .cover picture img{width:70%;height:200px;object-fit:cover;border-radius:4px 8px 8px 4px;transform:rotateY(-12deg);box-shadow:-6px 8px 20px rgba(23,32,33,.25);background:#f5f5f5}
.book-single{max-width:860px;margin:0 auto;padding:60px 20px}

@media(max-width:768px){.menu-toggle{display:block}.main-nav ul{display:none}.book-grid{grid-template-columns:repeat(2,1fr)}.hero{padding:60px 20px}}

<body data-page="download" id="top">

  <div id="site-header-host"></div>

  <div class="dl-page" id="dl-content">
    <p style="padding:40px 0;color:#999;">Preparing download...</p>
  </div>

  <div id="site-footer-host"></div>

  <script src="js/books.min.js"></script>
  <script src="js/main.min.js" defer></script>
  <script>
  (function runWhenReady(){
    if (typeof BOOKS === 'undefined') {
      setTimeout(runWhenReady, 40);
      return;
    }
    var params = new URLSearchParams(window.location.search);
    var bookId = params.get('id');
    var book = BOOKS.find(function(b){ return b.id === bookId; });
    var container = document.getElementById('dl-content');

    if(!book){
      container.innerHTML = '<h2 class="dl-title">Book Not Found</h2><p>Sorry, we could not find this book.</p><a href="all-books.html" class="dl-back">&larr; Browse All Books</a>';
      return;
    }

    var coverColors = {
      english:'#1E565C', grammar:'#6b4c3b', vocab:'#2e7d32', ielts:'#c62828',
      speaking:'#1565c0', writing:'#6a1b9a', kids:'#ef6c00', german:'#333',
      french:'#1a237e', spanish:'#b71c1c', chinese:'#d84315', japanese:'#4e342e',
      korean:'#283593', arabic:'#1b5e20', turkish:'#4a148c', general:'#37474f',
      health:'#0d6b4f', novel:'#4a2c6b', trading:'#0f4c5c', adventure:'#8b4513',
      literature:'#7a2424', business:'#1c2e4a', self:'#aa7619', grammar:'#1f6b3a', kids:'#c44b7d'
    };
    var bg = coverColors[book.cover] || '#1E565C';

    var catLabels = [];
    if(typeof CATEGORIES !== 'undefined'){
      book.categories.forEach(function(c){
        var cat = CATEGORIES.find(function(x){ return x.slug === c; });
        if(cat) catLabels.push(cat.label);
      });
    }

    var pdfUrl = book.pdf;
    var directUrl = null;
    var hasPdf = !!pdfUrl && book.access === 'download';

    if(!hasPdf){
      var q = encodeURIComponent(book.title || '');
      container.innerHTML =
        '<div class="dl-cover" style="background:' + bg + '">' + (book.cover||'Book').toUpperCase() + '</div>' +
        '<h1 class="dl-title">' + book.title + '</h1>' +
        '<div class="dl-cat">' + (catLabels.join(' &bull; ') || 'Book') + '</div>' +
        '<div class="dl-unavailable">' +
          '<h3>Read the official edition</h3>' +
          '<p>We offer a detailed overview of this book for study and reference. To read the full work, please support the author by getting an official copy.</p>' +
          '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">' +
            '<a class="dl-manual" href="https://openlibrary.org/search?q=' + q + '" target="_blank" rel="noopener nofollow">Find on Open Library</a>' +
            '<a class="dl-manual" style="background:#555" href="https://www.google.com/search?tbm=bks&q=' + q + '" target="_blank" rel="noopener nofollow">Search Google Books</a>' +
          '</div>' +
        '</div>' +
        '<br><a href="book/' + encodeURIComponent(book.id) + '.html" class="dl-back">&larr; Back to book overview</a>';
      return;
    }

    if(hasPdf){
      if(pdfUrl.indexOf('drive.google.com/file/d/') !== -1){
        var match = pdfUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if(match) directUrl = 'https://drive.usercontent.google.com/download?id=' + match[1] + '&export=download&confirm=t';
      } else if (pdfUrl.indexOf('/') === 0) {
        directUrl = pdfUrl;
      } else {
        directUrl = '/' + String(pdfUrl).replace(/^public\//, '');
      }
    }

    if(hasPdf && directUrl){
      container.innerHTML =
        '<div class="dl-cover" style="background:' + bg + '">' + (book.cover||'Book').toUpperCase() + '</div>' +
        '<h1 class="dl-title">' + book.title + '</h1>' +
        '<div class="dl-cat">' + (catLabels.join(' &bull; ') || 'Book') + '</div>' +
        '<div class="dl-status" id="dl-status">' +
          '<p id="dl-msg">Preparing your download...</p>' +
          '<div class="dl-progress-wrap"><div class="dl-progress-bar" id="dl-bar"></div></div>' +
          '<div class="dl-countdown" id="dl-count">3</div>' +
          '<div class="dl-hint">Your download will begin automatically — you will stay on this page</div>' +
        '</div>' +
        '<button class="dl-manual" id="dl-btn" style="display:none" onclick="triggerDownload()">&#8595; Download Now</button>' +
        '<br><a href="book/' + encodeURIComponent(book.id) + '.html" class="dl-back">&larr; Back to book details</a>';

      var bar = document.getElementById('dl-bar');
      var countEl = document.getElementById('dl-count');
      var msgEl = document.getElementById('dl-msg');
      var btnEl = document.getElementById('dl-btn');
      var seconds = 3;
      var elapsed = 0;

      var isLocal = directUrl.indexOf('http') !== 0 && directUrl.indexOf('//') !== 0;

      window.triggerDownload = function(){
        if (isLocal) {
          var a = document.createElement('a');
          a.href = directUrl;
          a.download = (book.id || 'book') + '.pdf';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } else {
          window.location.href = directUrl;
        }

        msgEl.textContent = 'Download started! Check your browser\u2019s download bar.';
        countEl.innerHTML = '<span style="color:#2ecc71;font-size:48px">&#10003;</span>';
        document.querySelector('.dl-hint').textContent = 'If the download didn\u2019t start, click the button below.';
        btnEl.style.display = 'inline-block';
      };

      var timer = setInterval(function(){
        elapsed++;
        bar.style.width = Math.min((elapsed / seconds) * 100, 100) + '%';
        countEl.textContent = Math.max(seconds - elapsed, 0);

        if(elapsed >= seconds){
          clearInterval(timer);
          window.triggerDownload();
        }
      }, 1000);

    } else {
      container.innerHTML =
        '<div class="dl-cover" style="background:' + bg + '">' + (book.cover||'Book').toUpperCase() + '</div>' +
        '<h1 class="dl-title">' + book.title + '</h1>' +
        '<div class="dl-cat">' + (catLabels.join(' &bull; ') || 'Book') + '</div>' +
        '<div class="dl-unavailable">' +
          '<h3>Download Being Prepared</h3>' +
          '<p>We are currently preparing the PDF download for this book. It will be available shortly. Please check back soon!</p>' +
        '</div>' +
        '<br><a href="book/' + encodeURIComponent(book.id) + '.html" class="dl-back">&larr; Back to book details</a>';
    }
  })();
  </script>
