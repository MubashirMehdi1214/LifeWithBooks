<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download | LifeWithBooks - Free PDF Ebook Library</title>
  <meta name="description" content="Download your selected free PDF ebook from LifeWithBooks. Educational content only - we respect copyright and remove disputed material on request.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://www.lifewithbooks.co/download.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Download | LifeWithBooks">
  <meta property="og:description" content="Download your selected free PDF ebook from LifeWithBooks.">
  <meta property="og:site_name" content="LifeWithBooks">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .dl-page{max-width:620px;margin:0 auto;padding:60px 20px 80px;text-align:center}
    .dl-cover{width:180px;height:240px;border-radius:8px;margin:0 auto 28px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px}
    .dl-title{font-size:22px;color:var(--contrast);margin-bottom:8px}
    .dl-cat{font-size:13px;color:var(--accent);margin-bottom:32px}
    .dl-status{margin-bottom:28px}
    .dl-status p{font-size:16px;color:var(--contrast-3);margin-bottom:12px}
    .dl-progress-wrap{background:#e8e8e8;border-radius:20px;height:12px;overflow:hidden;max-width:400px;margin:0 auto}
    .dl-progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-hover));border-radius:20px;transition:width .3s ease}
    .dl-countdown{font-size:32px;font-weight:800;color:var(--accent);margin:18px 0 6px}
    .dl-hint{font-size:13px;color:#999;margin-bottom:24px}
    .dl-manual{display:inline-block;padding:14px 36px;background:var(--accent);color:#fff;border-radius:var(--radius);font-weight:700;font-size:15px;text-decoration:none;transition:background .2s;cursor:pointer;border:none}
    .dl-manual:hover{background:var(--accent-hover);color:#fff}
    .dl-back{display:inline-block;margin-top:16px;font-size:14px;color:var(--accent)}
    .dl-success-icon{font-size:48px;color:#2ecc71;margin-bottom:12px}
    .dl-unavailable{background:#fef9e7;border:1px solid #f0e6c0;border-radius:8px;padding:24px;margin:20px auto;max-width:450px}
    .dl-unavailable h3{color:var(--contrast);font-size:17px;margin-bottom:8px}
    .dl-unavailable p{font-size:14px;color:var(--contrast-3);margin:0}
  </style>
</head>
<body data-page="download" id="top">

  <div id="site-header-host"></div>

  <div class="dl-page" id="dl-content">
    <p style="padding:40px 0;color:#999;">Preparing download...</p>
  </div>

  <div id="site-footer-host"></div>

  <script src="js/books.js"></script>
  <script src="js/main.js"></script>
  <script>
  (function(){
    var params = new URLSearchParams(window.location.search);
    var bookId = params.get('id');
    var book = BOOKS.find(function(b){ return b.id === bookId; });
    var container = document.getElementById('dl-content');

    if(!book){
      container.innerHTML = '<h2 class="dl-title">Book Not Found</h2><p>Sorry, we could not find this book.</p><a href="all-books.html" class="dl-back">&larr; Browse All Books</a>';
      return;
    }

    var coverColors = {
      english:'#1E565C', grammar:'#6b4c3b', vocab:'#2e7d32', ielts:'#c62828',
      speaking:'#1565c0', writing:'#6a1b9a', kids:'#ef6c00', german:'#333',
      french:'#1a237e', spanish:'#b71c1c', chinese:'#d84315', japanese:'#4e342e',
      korean:'#283593', arabic:'#1b5e20', turkish:'#4a148c', general:'#37474f',
      health:'#0d6b4f', novel:'#4a2c6b', trading:'#0f4c5c', adventure:'#8b4513',
      literature:'#7a2424', business:'#1c2e4a', self:'#aa7619', grammar:'#1f6b3a', kids:'#c44b7d'
    };
    var bg = coverColors[book.cover] || '#1E565C';

    var catLabels = [];
    if(typeof CATEGORIES !== 'undefined'){
      book.categories.forEach(function(c){
        var cat = CATEGORIES.find(function(x){ return x.slug === c; });
        if(cat) catLabels.push(cat.label);
      });
    }

    var pdfUrl = book.pdf;
    var directUrl = null;
    var hasPdf = !!pdfUrl && book.access === 'download';

    if(!hasPdf){
      var q = encodeURIComponent(book.title || '');
      container.innerHTML =
        '<div class="dl-cover" style="background:' + bg + '">' + (book.cover||'Book').toUpperCase() + '</div>' +
        '<h1 class="dl-title">' + book.title + '</h1>' +
        '<div class="dl-cat">' + (catLabels.join(' &bull; ') || 'Book') + '</div>' +
        '<div class="dl-unavailable">' +
          '<h3>Read the official edition</h3>' +
          '<p>We offer a detailed overview of this book for study and reference. To read the full work, please support the author by getting an official copy.</p>' +
          '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">' +
            '<a class="dl-manual" href="https://openlibrary.org/search?q=' + q + '" target="_blank" rel="noopener nofollow">Find on Open Library</a>' +
            '<a class="dl-manual" style="background:#555" href="https://www.google.com/search?tbm=bks&q=' + q + '" target="_blank" rel="noopener nofollow">Search Google Books</a>' +
          '</div>' +
        '</div>' +
        '<br><a href="book.html?id=' + book.id + '" class="dl-back">&larr; Back to book overview</a>';
      return;
    }

    if(hasPdf){
      if(pdfUrl.indexOf('drive.google.com/file/d/') !== -1){
        var match = pdfUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if(match) directUrl = 'https://drive.usercontent.google.com/download?id=' + match[1] + '&export=download&confirm=t';
      } else {
        directUrl = pdfUrl;
      }
    }

    if(hasPdf && directUrl){
      container.innerHTML =
        '<div class="dl-cover" style="background:' + bg + '">' + (book.cover||'Book').toUpperCase() + '</div>' +
        '<h1 class="dl-title">' + book.title + '</h1>' +
        '<div class="dl-cat">' + (catLabels.join(' &bull; ') || 'Book') + '</div>' +
        '<div class="dl-status" id="dl-status">' +
          '<p id="dl-msg">Preparing your download...</p>' +
          '<div class="dl-progress-wrap"><div class="dl-progress-bar" id="dl-bar"></div></div>' +
          '<div class="dl-countdown" id="dl-count">3</div>' +
          '<div class="dl-hint">Your download will begin automatically — you will stay on this page</div>' +
        '</div>' +
        '<button class="dl-manual" id="dl-btn" style="display:none" onclick="triggerDownload()">&#8595; Download Now</button>' +
        '<br><a href="book.html?id=' + book.id + '" class="dl-back">&larr; Back to book details</a>';

      var bar = document.getElementById('dl-bar');
      var countEl = document.getElementById('dl-count');
      var msgEl = document.getElementById('dl-msg');
      var btnEl = document.getElementById('dl-btn');
      var seconds = 3;
      var elapsed = 0;

      var isLocal = directUrl.indexOf('http') !== 0;

      window.triggerDownload = function(){
        if (isLocal) {
          var a = document.createElement('a');
          a.href = directUrl;
          a.download = (book.id || 'book') + '.pdf';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } else {
          window.location.href = directUrl;
        }

        msgEl.textContent = 'Download started! Check your browser\u2019s download bar.';
        countEl.innerHTML = '<span style="color:#2ecc71;font-size:48px">&#10003;</span>';
        document.querySelector('.dl-hint').textContent = 'If the download didn\u2019t start, click the button below.';
        btnEl.style.display = 'inline-block';
      };

      var timer = setInterval(function(){
        elapsed++;
        bar.style.width = Math.min((elapsed / seconds) * 100, 100) + '%';
        countEl.textContent = Math.max(seconds - elapsed, 0);

        if(elapsed >= seconds){
          clearInterval(timer);
          window.triggerDownload();
        }
      }, 1000);

    } else {
      container.innerHTML =
        '<div class="dl-cover" style="background:' + bg + '">' + (book.cover||'Book').toUpperCase() + '</div>' +
        '<h1 class="dl-title">' + book.title + '</h1>' +
        '<div class="dl-cat">' + (catLabels.join(' &bull; ') || 'Book') + '</div>' +
        '<div class="dl-unavailable">' +
          '<h3>Download Being Prepared</h3>' +
          '<p>We are currently preparing the PDF download for this book. It will be available shortly. Please check back soon!</p>' +
        '</div>' +
        '<br><a href="book.html?id=' + book.id + '" class="dl-back">&larr; Back to book details</a>';
    }
  })();
  </script>
</body>
</html>
